<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Click Counter</title>
<style>
  body {
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #f4f4f4;
  }
  h1 { font-size: 4rem; margin: 0 0 20px; }
  button {
    font-size: 1.5rem;
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    background: #4f46e5;
    color: white;
    cursor: pointer;
  }
  button:hover { background: #4338ca; }
</style>
</head>
<body>
  <h1 id="count">0</h1>
  <button onclick="increment()">Click me</button>

  <script>
    let count = 0;
    function increment() {
      count++;
      document.getElementById('count').textContent = count;
    }
  </script>
</body>
</html>
